name: Deploy to AWS EC2

# Déclencheur : Le robot se réveille dès que tu fais un push sur la branche main
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Récupérer le code source du projet
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Se connecter au serveur en SSH et exécuter les commandes de mise à jour
    - name: Run deployment script on remote server
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.AWS_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_SSH_KEY }}
        script: |
          cd cli-tools
          git pull origin main
          npm install
          echo "Déploiement terminé avec succès !"